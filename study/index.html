<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >
<meta name="robots" content="noindex, nofollow, noarchive">
  <title>The Study | Lies &amp; Ink</title>
  <link
    rel="stylesheet"
    href="../css/common.css"
  >
  <link
    rel="stylesheet"
    href="../css/study.css"
  >
</head>
<body>
  <main
    id="study"
    class="study"
  >
    <!-- ========================================
         BACKGROUND
    ======================================== -->
    <div
      class="study__background"
      aria-hidden="true"
    ></div>
    <div
      class="study__light"
      aria-hidden="true"
    ></div>
    <!-- ========================================
         HOME LINK
    ======================================== -->
    <a
      href="../index.html"
      class="study-home-link"
    >
      ‹ HOME
    </a>
    <!-- ========================================
         HEADER
    ======================================== -->
    <header class="study-header">
      <p class="study-header__small">
        LIES &amp; INK
      </p>
      <h1 class="study-header__title">
        THE STUDY
      </h1>
      <p class="study-header__description">
        SELECT A SHELF
      </p>
    </header>
    <!-- ========================================
         SHELVES
         JavaScriptで自動生成
    ======================================== -->
    <section
      class="shelves"
      id="shelves"
      aria-label="Categories"
    ></section>
    <!-- ========================================
         SCROLL INDICATOR
    ======================================== -->
    <div
      class="study-scroll-indicator"
      id="scrollIndicator"
      aria-hidden="true"
    >
      <span class="study-scroll-indicator__text">
        SCROLL
      </span>
      <span class="study-scroll-indicator__line"></span>
    </div>
    <!-- ========================================
         SHELF FOCUS
         選択された棚・本の拡大演出
    ======================================== -->
    <div
      class="shelf-focus"
      id="shelfFocus"
      aria-hidden="true"
    >
      <div class="shelf-focus__inner">
        <p
          class="shelf-focus__category"
          id="focusCategory"
        ></p>
        <div
          class="shelf-focus__books"
          id="focusBooks"
          aria-hidden="true"
        ></div>
        <div
          class="shelf-focus__line"
        ></div>
      </div>
    </div>
    <!-- ========================================
         PAGE TRANSITION
    ======================================== -->
    <div
      class="study-transition"
      id="studyTransition"
      aria-hidden="true"
    >
      <p class="study-transition__small">
        ENTERING
      </p>
      <p
        class="study-transition__title"
        id="transitionCategory"
      ></p>
    </div>
  </main>
  <!-- ========================================
       DATA
  ======================================== -->
  <script src="../js/data.js"></script>
  <!-- ========================================
       STUDY
  ======================================== -->
  <script src="../js/study.js"></script>
</body>
</html>
