<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >
  <meta
    name="robots"
    content="noindex, nofollow, noarchive"
  >

  <title>Lies &amp; Ink — Work</title>

  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/work.css">
</head>

<body class="work-page">

  <main class="work" id="work">

    <div class="work__background" aria-hidden="true"></div>

    <header class="work-header">
      <a
        href="#"
        class="work-header__back"
        id="backToBookshelf"
      >
        ‹ BOOKSHELF
      </a>

      <div class="work-header__brand">
        LIES &amp; INK
      </div>
    </header>


    <section
      class="work-intro"
      id="workIntro"
      aria-label="作品情報"
    >

      <div
        class="work-cover"
        id="workCover"
        aria-hidden="true"
        hidden
      >
        <img
          id="workCoverImage"
          class="work-cover__image"
          src=""
          alt=""
        >
      </div>


      <div
        class="work-title"
        id="workTitleBlock"
        aria-label="作品タイトル"
      >
        <p
          class="work-title__number"
          id="workNumber"
        >
          01
        </p>

        <h1
          class="work-title__title"
          id="workTitle"
        >
          —
        </h1>
      </div>


      <section
        class="work-info"
        id="workInfo"
        aria-label="作品紹介"
      >
        <div
          class="work-info__meta"
          id="workMeta"
          aria-hidden="true"
        ></div>

        <div
          class="work-info__description"
          id="workDescription"
        ></div>
      </section>

    </section>


    <section
      class="work-reader"
      id="workReader"
      aria-label="作品本文"
    >

      <div
        class="work-page-view"
        id="workPageView"
      >
        <article
          class="work-story"
          id="workBody"
        ></article>
      </div>


      <!-- ページ番号 -->
      <button
        type="button"
        class="work-page-indicator"
        id="workPageIndicator"
        aria-label="ページを指定して移動"
      >
        <span id="currentPage">01</span>
        <span class="work-page-indicator__slash">/</span>
        <span id="totalPages">01</span>
      </button>


      <!-- ページジャンプ -->
      <div
        class="work-page-jump"
        id="workPageJump"
        hidden
      >
        <div class="work-page-jump__inner">

          <p class="work-page-jump__label">
            GO TO PAGE
          </p>

          <div class="work-page-jump__form">

            <input
              type="number"
              id="pageJumpInput"
              class="work-page-jump__input"
              min="1"
              inputmode="numeric"
              pattern="[0-9]*"
              aria-label="移動するページ番号"
            >

            <span class="work-page-jump__total">
              / <span id="pageJumpTotal">01</span>
            </span>

            <button
              type="button"
              id="pageJumpButton"
              class="work-page-jump__button"
            >
              GO
            </button>

          </div>

          <button
            type="button"
            id="pageJumpClose"
            class="work-page-jump__close"
          >
            CANCEL
          </button>

        </div>
      </div>


      <!-- 前後ページ -->
      <nav
        class="work-page-navigation"
        aria-label="ページ移動"
      >

        <button
          type="button"
          class="work-page-navigation__button work-page-navigation__prev"
          id="prevPage"
        >
          ‹ PREV
        </button>

        <button
          type="button"
          class="work-page-navigation__button work-page-navigation__next"
          id="nextPage"
        >
          NEXT ›
        </button>

      </nav>

    </section>


    <footer class="work-footer">

      <a
        href="#"
        id="backToBookshelfFooter"
        class="work-footer__back"
      >
        BACK TO BOOKSHELF
      </a>

    </footer>


    <div
      class="work-loading"
      id="workLoading"
      aria-hidden="true"
    >
      <span id="workLoadingText">
        LOADING
      </span>
    </div>

  </main>


  <script src="../js/data.js"></script>
  <script src="../js/work.js?v=4"></script>

</body>
</html>
